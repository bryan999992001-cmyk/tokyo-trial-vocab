<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東京大審英文單字測驗</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#10213a;--muted:#657184;--red:#b63c32;--gold:#c89b4b;--green:#1f7a5a;--line:#ded7ca;--blue:#eaf0f8;}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f8f4ec,#edf1f5);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid #eee;padding:14px 18px;font-weight:800}
.wrap{max-width:860px;margin:auto;padding:18px}
.hero{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 18px 44px #23334a14;border:1px solid #eee5d6}
.kicker{color:var(--red);font-weight:900;letter-spacing:.08em} h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(32px,6vw,58px);margin:8px 0 4px} .sub{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0} .stat{background:#f7f4ee;border-radius:18px;padding:12px;text-align:center} .stat b{display:block;font-size:24px} .stat span{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:12px} button{border:0;border-radius:16px;padding:15px 18px;font-size:18px;font-weight:800;cursor:pointer} .primary{background:var(--red);color:white} .secondary{background:var(--ink);color:white} .ghost{background:#f2eee6;color:var(--ink)}
.filters{display:flex;overflow:auto;gap:10px;padding:14px 0 4px;scrollbar-width:none} .chip{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:999px;font-weight:700;font-size:14px} .chip.active{background:var(--ink);color:white}
.card{margin-top:18px;background:var(--card);border-radius:28px;padding:24px;box-shadow:0 18px 44px #23334a12;border:1px solid #eee5d6}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px} .term{font-family:Georgia,serif;font-size:clamp(36px,8vw,62px);margin:26px 0 8px} .prompt{font-size:16px;color:var(--muted);margin-bottom:18px}
.options{display:grid;gap:12px} .option{text-align:left;background:white;border:1.5px solid var(--line);color:var(--ink);font-weight:700} .option.correct{background:#e4f4ec;border-color:#4d9a79;color:#155a41} .option.wrong{background:#fbe9e7;border-color:#cf665d;color:#8c2b24}
.explain{margin-top:20px;background:var(--blue);border-radius:20px;padding:18px;display:none} .explain.show{display:block} .explain h3{margin:0 0 10px;color:var(--red)} .answerline{font-size:22px;font-weight:900} .section{margin-top:14px;padding-top:12px;border-top:1px solid #cfd8e5} .label{font-weight:900;color:#31435b;margin-bottom:4px} .example{font-style:italic;font-size:17px}
.others{display:grid;gap:8px;margin-top:8px} .other{background:#ffffffa8;border-radius:12px;padding:10px}
.nextbar{margin-top:16px;display:flex;gap:10px;justify-content:flex-end}
.finish{text-align:center;padding:28px 10px} .finish .big{font-family:Georgia,serif;font-size:54px} .hidden{display:none!important}
.note{font-size:13px;color:var(--muted);margin-top:12px} .danger{color:#9c2f28}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)} .actions{grid-template-columns:1fr} .wrap{padding:12px} .hero,.card{border-radius:22px;padding:18px} .term{margin-top:20px}}
</style>
</head>
<body>
<header>東京大審英文單字測驗</header>
<div class="wrap">
<section class="hero" id="home">
  <div class="kicker">審・500 字擴充版</div>
  <h1>Judgment at Tokyo Vocabulary</h1>
  <div class="sub">500 字核心題庫｜歷史、法律、國際政治與修辭｜15 題循環練習</div>
  <div class="stats">
    <div class="stat"><b id="doneCount">0</b><span>累計作答</span></div>
    <div class="stat"><b id="acc">—</b><span>正確率</span></div>
    <div class="stat"><b id="wrongCount">0</b><span>錯題</span></div>
    <div class="stat"><b>107</b><span>目前詞庫</span></div>
  </div>
  <div class="actions">
    <button class="primary" onclick="startRound(false)">開始 15 題</button>
    <button class="secondary" id="wrongBtn" onclick="startRound(true)">錯題練習 0</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="note">熟悉的字會降低出題權重；答錯兩次以上的字會優先出現。學習紀錄只存在這台瀏覽器。</div>
</section>

<section class="card hidden" id="quiz">
  <div class="qmeta"><span id="qcat"></span><span id="progress"></span></div>
  <div class="term" id="term"></div>
  <div class="prompt">選出最準確的中文意思</div>
  <div class="options" id="options"></div>
  <div class="explain" id="explain"></div>
  <div class="nextbar"><button class="secondary hidden" id="nextBtn" onclick="nextQuestion()">下一題 ↵</button></div>
</section>

<section class="card hidden" id="finish">
  <div class="finish">
    <div class="big" id="finishScore">完成</div>
    <p id="finishText"></p>
    <div class="actions">
      <button class="primary" onclick="startRound(false)">下一組 15 題</button>
      <button class="secondary" id="reviewRoundBtn" onclick="reviewThisRound()">複習本輪錯題</button>
    </div>
  </div>
</section>
</div>

<script>
const WORDS = [{"term": "remonstrate", "meaning": "抗議、規勸", "category": "學術與修辭", "breakdown": "re-（回、反覆）＋ monstrare（指出、警示）→ 對某事提出強烈規勸或抗議", "family": "remonstrance（n. 抗議、勸諫）", "example": "Several judges remonstrated against the way the issue was framed.", "example_zh": "幾位法官對該議題的 framing 方式提出強烈異議。", "context": "正式、書面語；常見於政治、法律與歷史敘述。"}, {"term": "institutional continuity", "meaning": "制度延續性", "category": "法律與政治", "breakdown": "institution → institutional；continue → continuous → continuity", "family": "institution / institutional / continuity", "example": "Despite the change of government, there was considerable institutional continuity.", "example_zh": "儘管政府更替，制度上仍維持相當程度的延續性。", "context": "常用來討論政權更替後，舊有法律、官僚與行政制度是否繼續存在。"}, {"term": "acquit", "meaning": "宣告無罪、判決無罪", "category": "法律與政治", "breakdown": "源自拉丁文 acquietare，原義有「使免於責任」之意", "family": "acquittal（n. 無罪判決）", "example": "The tribunal acquitted him on that particular charge.", "example_zh": "法庭就該項特定指控判他無罪。", "context": "法律核心字；與 convict（定罪）相對。"}, {"term": "dissent", "meaning": "異議、不同意見", "category": "法律與政治", "breakdown": "dis-（分離）＋ sentire（感受、想法）→ 想法分歧", "family": "dissenting opinion（不同意見書）", "example": "One judge issued a blistering dissent.", "example_zh": "其中一位法官提出措辭強烈的不同意見書。", "context": "法院判決、政治與學術論辯常見。"}, {"term": "jurisdiction", "meaning": "司法管轄權、管轄範圍", "category": "法律與政治", "breakdown": "juris（法律）＋ diction（宣告、說）→ 宣告法律的權限", "family": "jurisdictional（adj. 管轄權的）", "example": "The defense challenged the tribunal's jurisdiction.", "example_zh": "辯方質疑該法庭的司法管轄權。", "context": "國際法與法院制度高頻字。"}, {"term": "indictment", "meaning": "起訴書、正式指控", "category": "法律與政治", "breakdown": "indict（正式起訴）＋ -ment", "family": "indict / indicted", "example": "The indictment listed multiple counts of war crimes.", "example_zh": "起訴書列出多項戰爭罪指控。", "context": "刑事訴訟核心字。"}, {"term": "prosecution", "meaning": "檢方；起訴", "category": "法律與政治", "breakdown": "prosecute（起訴、追訴）＋ -ion", "family": "prosecutor（檢察官）", "example": "The prosecution argued that the policy was deliberate.", "example_zh": "檢方主張該政策是有意為之。", "context": "法律文本高頻。"}, {"term": "defendant", "meaning": "被告", "category": "法律與政治", "breakdown": "defend（辯護、防衛）＋ -ant", "family": "defense / defendant", "example": "Each defendant was allowed to present a defense.", "example_zh": "每位被告都被允許提出辯護。", "context": "與 plaintiff（原告，民事）區分。"}, {"term": "culpability", "meaning": "罪責、可歸責性", "category": "法律與政治", "breakdown": "culpable（有罪責的）＋ -ity", "family": "culpable / culpability", "example": "The court examined the degree of individual culpability.", "example_zh": "法院檢視個人的罪責程度。", "context": "比 guilt 更偏向法律或道德責任程度。"}, {"term": "impunity", "meaning": "免於懲罰、有罪不罰", "category": "法律與政治", "breakdown": "im-（不）＋ punishment 同源概念", "family": "with impunity（逍遙法外地）", "example": "Officials could not act with impunity.", "example_zh": "官員不能在不受懲罰的情況下任意行事。", "context": "人權、戰爭罪、政治責任常見。"}, {"term": "retroactive", "meaning": "溯及既往的", "category": "法律與政治", "breakdown": "retro-（向後）＋ active", "family": "retroactivity（n. 溯及既往）", "example": "The defense objected to the retroactive application of the law.", "example_zh": "辯方反對法律的溯及既往適用。", "context": "國際刑法與法治原則常見。"}, {"term": "precedent", "meaning": "先例、判例", "category": "法律與政治", "breakdown": "precede（先於）→ 先前可作為依據的案例", "family": "precedential（有判例效力的）", "example": "The judgment created an important legal precedent.", "example_zh": "該判決建立了一項重要的法律先例。", "context": "法律與政策討論高頻。"}, {"term": "sovereignty", "meaning": "主權", "category": "法律與政治", "breakdown": "sovereign（主權者、最高統治者）＋ -ty", "family": "sovereign state（主權國家）", "example": "The issue raised questions about national sovereignty.", "example_zh": "該問題引發了關於國家主權的疑問。", "context": "國際關係核心字。"}, {"term": "legitimacy", "meaning": "正當性、合法性", "category": "法律與政治", "breakdown": "legitimate（正當／合法）＋ -cy", "family": "legitimize（使正當化）", "example": "The occupation authorities sought political legitimacy.", "example_zh": "佔領當局尋求政治正當性。", "context": "政治學超高頻。"}, {"term": "constitutional", "meaning": "憲政的、憲法上的", "category": "法律與政治", "breakdown": "constitution → constitutional", "family": "constitution / constitutionalism", "example": "The reform altered the constitutional order.", "example_zh": "該改革改變了憲政秩序。", "context": "政治制度與法律史常見。"}, {"term": "restitution", "meaning": "返還、恢復原狀、賠償", "category": "法律與政治", "breakdown": "re-（回）＋ statuere（放置）→ 放回原狀", "family": "restitute（v. 恢復、返還）", "example": "Victims demanded restitution for confiscated property.", "example_zh": "受害者要求返還遭沒收的財產。", "context": "戰後賠償、財產法常見。"}, {"term": "reparation", "meaning": "賠償、補償", "category": "法律與政治", "breakdown": "repair 同源，核心概念是「修補損害」", "family": "war reparations（戰爭賠款）", "example": "The treaty required the payment of reparations.", "example_zh": "該條約要求支付賠款。", "context": "戰後秩序與國際法高頻。"}, {"term": "ratify", "meaning": "正式批准、追認", "category": "法律與政治", "breakdown": "rat-（確定）＋ -ify（使成為）", "family": "ratification（n. 批准）", "example": "The treaty entered into force after the states ratified it.", "example_zh": "各國批准條約後，該條約正式生效。", "context": "條約與國際組織常見。"}, {"term": "abrogate", "meaning": "廢除、撤銷（法律或協定）", "category": "法律與政治", "breakdown": "ab-（離開）＋ rogare（提案、詢問）", "family": "abrogation（n. 廢止）", "example": "The new government abrogated the earlier agreement.", "example_zh": "新政府廢除了先前的協議。", "context": "正式法律用語。"}, {"term": "promulgate", "meaning": "公布、頒布（法律）", "category": "法律與政治", "breakdown": "源自拉丁文 promulgare，指正式公開宣布", "family": "promulgation（n. 頒布）", "example": "The constitution was promulgated after the war.", "example_zh": "該憲法於戰後正式公布。", "context": "法律史常見。"}, {"term": "occupation", "meaning": "佔領、軍事佔領", "category": "戰爭與帝國", "breakdown": "occupy → occupation", "family": "occupying power（佔領國／佔領當局）", "example": "The country underwent sweeping reforms during the occupation.", "example_zh": "該國在佔領期間經歷大規模改革。", "context": "戰後日本史核心字。"}, {"term": "belligerent", "meaning": "交戰國；好戰的", "category": "戰爭與帝國", "breakdown": "bellum（戰爭）同源", "family": "belligerency（交戰狀態）", "example": "The rights of belligerent states were disputed.", "example_zh": "交戰國的權利受到爭議。", "context": "國際人道法常見。"}, {"term": "armistice", "meaning": "停戰協定", "category": "戰爭與帝國", "breakdown": "arms（武器）＋ -stice（停止）概念", "family": "sign an armistice（簽署停戰協定）", "example": "The fighting ceased after the armistice was signed.", "example_zh": "停戰協定簽署後，戰鬥停止。", "context": "與 peace treaty（和平條約）不同。"}, {"term": "capitulate", "meaning": "投降、屈服", "category": "戰爭與帝國", "breakdown": "capitulum（章節、條款）→ 依條款投降", "family": "capitulation（n. 投降）", "example": "The garrison eventually capitulated.", "example_zh": "守軍最終投降。", "context": "軍事史常見。"}, {"term": "annex", "meaning": "併吞、兼併", "category": "戰爭與帝國", "breakdown": "ad-（向）＋ nectere（連結）→ 接到自己這邊", "family": "annexation（n. 兼併）", "example": "The empire annexed the territory by force.", "example_zh": "帝國以武力併吞該領土。", "context": "帝國史與國際法高頻。"}, {"term": "mobilize", "meaning": "動員", "category": "戰爭與帝國", "breakdown": "mobile（可移動）→ 使軍隊／資源進入行動狀態", "family": "mobilization（n. 動員）", "example": "The government mobilized troops along the border.", "example_zh": "政府沿邊境動員軍隊。", "context": "軍事、政治、社會運動都常見。"}, {"term": "demobilize", "meaning": "解除動員、遣散軍隊", "category": "戰爭與帝國", "breakdown": "de-（解除）＋ mobilize", "family": "demobilization", "example": "Millions of soldiers were demobilized after the war.", "example_zh": "戰後數百萬士兵被解除動員。", "context": "戰後復員常用。"}, {"term": "atrocity", "meaning": "暴行、殘酷行為", "category": "戰爭與帝國", "breakdown": "atrocious（殘暴的）同族", "family": "wartime atrocities（戰時暴行）", "example": "The commission documented numerous wartime atrocities.", "example_zh": "委員會記錄了大量戰時暴行。", "context": "戰爭罪與人權史高頻。"}, {"term": "reprisal", "meaning": "報復性行動", "category": "戰爭與帝國", "breakdown": "reprise 同源，核心為「取回、報復」", "family": "retaliatory reprisal（報復行動）", "example": "The army carried out reprisals against civilians.", "example_zh": "軍隊對平民進行報復性行動。", "context": "國際人道法中有特定技術意義。"}, {"term": "conscription", "meaning": "徵兵、兵役徵集", "category": "戰爭與帝國", "breakdown": "con-＋ script（書寫）→ 列入名冊", "family": "conscript（徵召入伍）", "example": "The state expanded conscription during the war.", "example_zh": "國家在戰時擴大徵兵。", "context": "軍事制度史常見。"}, {"term": "insurgency", "meaning": "叛亂、反政府武裝活動", "category": "戰爭與帝國", "breakdown": "insurgent（叛亂者）＋ -cy", "family": "counterinsurgency（反叛亂）", "example": "The army struggled to suppress the insurgency.", "example_zh": "軍隊難以壓制叛亂。", "context": "軍事與殖民史常見。"}, {"term": "counteroffensive", "meaning": "反攻", "category": "戰爭與帝國", "breakdown": "counter-（反）＋ offensive（攻勢）", "family": "launch a counteroffensive", "example": "The allies launched a major counteroffensive.", "example_zh": "盟軍發動大規模反攻。", "context": "軍事史常見。"}, {"term": "attrition", "meaning": "消耗、消耗戰", "category": "戰爭與帝國", "breakdown": "attrit-（磨損）→ 逐步削弱", "family": "war of attrition（消耗戰）", "example": "The campaign turned into a war of attrition.", "example_zh": "這場戰役演變成消耗戰。", "context": "軍事分析高頻。"}, {"term": "encirclement", "meaning": "包圍、合圍", "category": "戰爭與帝國", "breakdown": "en-＋ circle ＋ -ment", "family": "encircle（v. 包圍）", "example": "The army faced encirclement and possible destruction.", "example_zh": "該軍面臨被合圍與殲滅的風險。", "context": "陸戰敘述高頻。"}, {"term": "blockade", "meaning": "封鎖", "category": "戰爭與帝國", "breakdown": "block＋-ade", "family": "naval blockade（海上封鎖）", "example": "The blockade severely restricted imports.", "example_zh": "封鎖嚴重限制了進口。", "context": "海戰與經濟戰常見。"}, {"term": "logistics", "meaning": "後勤", "category": "戰爭與帝國", "breakdown": "logistic → logistics", "family": "logistical（後勤的）", "example": "Poor logistics undermined the campaign.", "example_zh": "糟糕的後勤削弱了這場戰役。", "context": "軍事史必懂。"}, {"term": "coalition", "meaning": "聯盟、聯合陣營", "category": "外交與思想", "breakdown": "coalesce（合併）同源", "family": "coalition government（聯合政府）", "example": "A broad coalition formed against the expansionist power.", "example_zh": "一個廣泛聯盟形成，以對抗擴張中的強權。", "context": "外交與國內政治都高頻。"}, {"term": "appeasement", "meaning": "綏靖、姑息政策", "category": "外交與思想", "breakdown": "appease（安撫）＋ -ment", "family": "appease / appeasement", "example": "Critics argued that appeasement only encouraged further aggression.", "example_zh": "批評者認為綏靖只會鼓勵進一步侵略。", "context": "二戰前外交史核心詞。"}, {"term": "deterrence", "meaning": "嚇阻", "category": "外交與思想", "breakdown": "deter（阻止）＋ -ence", "family": "nuclear deterrence（核嚇阻）", "example": "The alliance relied on deterrence to prevent attack.", "example_zh": "該聯盟仰賴嚇阻來防止攻擊。", "context": "國際關係核心概念。"}, {"term": "containment", "meaning": "圍堵政策、遏制", "category": "外交與思想", "breakdown": "contain（控制在範圍內）＋ -ment", "family": "policy of containment", "example": "The strategy aimed at containment rather than immediate confrontation.", "example_zh": "該戰略著眼於圍堵，而非立即正面衝突。", "context": "冷戰史高頻。"}, {"term": "rapprochement", "meaning": "和解、關係改善", "category": "外交與思想", "breakdown": "法語來源，rapprocher＝拉近", "family": "diplomatic rapprochement", "example": "The two states pursued a gradual rapprochement.", "example_zh": "兩國逐步推動關係正常化。", "context": "外交史常見。"}, {"term": "realignment", "meaning": "重新結盟、陣營重組", "category": "外交與思想", "breakdown": "re-＋ alignment", "family": "strategic realignment", "example": "The crisis triggered a major regional realignment.", "example_zh": "危機引發區域內重大陣營重組。", "context": "國際關係與選舉政治皆可用。"}, {"term": "hegemony", "meaning": "霸權、領導優勢", "category": "外交與思想", "breakdown": "希臘文 hegemon＝領導者", "family": "hegemonic（霸權的）", "example": "The power sought regional hegemony.", "example_zh": "該強權追求區域霸權。", "context": "國際關係核心字。"}, {"term": "sphere of influence", "meaning": "勢力範圍", "category": "外交與思想", "breakdown": "固定搭配", "family": "within a sphere of influence", "example": "The peninsula became part of a contested sphere of influence.", "example_zh": "該半島成為各方爭奪的勢力範圍之一。", "context": "帝國史與外交史高頻。"}, {"term": "balance of power", "meaning": "權力平衡、勢力均衡", "category": "外交與思想", "breakdown": "固定搭配", "family": "maintain the balance of power", "example": "The alliance was designed to preserve the balance of power.", "example_zh": "該聯盟旨在維持權力平衡。", "context": "國際關係核心概念。"}, {"term": "revisionist power", "meaning": "修正現狀的強權", "category": "外交與思想", "breakdown": "revisionist＝主張修改既有秩序的", "family": "revisionism", "example": "The state was increasingly viewed as a revisionist power.", "example_zh": "該國愈來愈被視為試圖修改現狀的強權。", "context": "國際政治分析常見。"}, {"term": "status quo", "meaning": "現狀", "category": "外交與思想", "breakdown": "拉丁文，意為「目前的狀態」", "family": "preserve / alter the status quo", "example": "Neither side was satisfied with the status quo.", "example_zh": "雙方都不滿意現狀。", "context": "政治外交高頻。"}, {"term": "multilateral", "meaning": "多邊的", "category": "外交與思想", "breakdown": "multi-（多）＋ lateral（邊）", "family": "multilateralism（多邊主義）", "example": "The dispute was addressed through multilateral negotiations.", "example_zh": "該爭端透過多邊談判處理。", "context": "外交與國際組織高頻。"}, {"term": "bilateral", "meaning": "雙邊的", "category": "外交與思想", "breakdown": "bi-（二）＋ lateral", "family": "bilateral relations（雙邊關係）", "example": "The issue strained bilateral relations.", "example_zh": "該議題使雙邊關係緊張。", "context": "外交基本字。"}, {"term": "diplomatic recognition", "meaning": "外交承認", "category": "外交與思想", "breakdown": "recognition＝正式承認其法律／政治地位", "family": "recognize a government/state", "example": "The new regime sought diplomatic recognition abroad.", "example_zh": "新政權尋求外國的外交承認。", "context": "外交史重要搭配。"}, {"term": "nonaggression pact", "meaning": "互不侵犯條約", "category": "外交與思想", "breakdown": "non-＋ aggression ＋ pact", "family": "sign a nonaggression pact", "example": "The two countries signed a nonaggression pact.", "example_zh": "兩國簽署互不侵犯條約。", "context": "戰間期外交史常見。"}, {"term": "ultimatum", "meaning": "最後通牒", "category": "外交與思想", "breakdown": "ultimate（最後的）同源", "family": "issue an ultimatum", "example": "The government rejected the ultimatum.", "example_zh": "政府拒絕了最後通牒。", "context": "外交危機高頻。"}, {"term": "concession", "meaning": "讓步；租界（依語境）", "category": "外交與思想", "breakdown": "concede（讓步）＋ -sion", "family": "make concessions", "example": "The weaker state was forced to make major concessions.", "example_zh": "較弱的一方被迫作出重大讓步。", "context": "近代東亞史中也可指租界。"}, {"term": "protectorate", "meaning": "保護國、受保護領", "category": "外交與思想", "breakdown": "protect＋-orate", "family": "colonial protectorate", "example": "The territory was turned into a protectorate.", "example_zh": "該領土被改為保護國。", "context": "帝國主義史常見。"}, {"term": "client state", "meaning": "附庸國、受強權支配的國家", "category": "外交與思想", "breakdown": "client 在此非「客戶」，而是依附者", "family": "client regime", "example": "The regime functioned largely as a client state.", "example_zh": "該政權在很大程度上以附庸國形式運作。", "context": "國際政治常見。"}, {"term": "proxy", "meaning": "代理人；代理戰爭中的代理力量", "category": "外交與思想", "breakdown": "proxy＝代表他人行動的人或力量", "family": "proxy war（代理人戰爭）", "example": "The conflict became a proxy war between larger powers.", "example_zh": "該衝突演變為大國之間的代理人戰爭。", "context": "冷戰與現代衝突高頻。"}, {"term": "nationalism", "meaning": "民族主義、國族主義", "category": "外交與思想", "breakdown": "nation＋-al＋-ism", "family": "nationalist / nationalistic", "example": "Nationalism reshaped political loyalties across the region.", "example_zh": "民族主義重塑了整個區域的政治忠誠。", "context": "近代史核心概念。"}, {"term": "militarism", "meaning": "軍國主義", "category": "外交與思想", "breakdown": "military＋-ism", "family": "militarist / militaristic", "example": "The prosecution portrayed militarism as a driving force behind expansion.", "example_zh": "檢方將軍國主義描述為擴張背後的主要動力。", "context": "日本近代史高頻。"}, {"term": "imperialism", "meaning": "帝國主義", "category": "外交與思想", "breakdown": "imperial＋-ism", "family": "imperialist / imperial", "example": "The debate centered on the legacy of imperialism.", "example_zh": "爭論聚焦於帝國主義的歷史遺產。", "context": "殖民史與國際政治高頻。"}, {"term": "self-determination", "meaning": "民族自決、自決權", "category": "外交與思想", "breakdown": "self＋determination", "family": "right to self-determination", "example": "The principle of self-determination gained wider support after the war.", "example_zh": "戰後，自決原則獲得更廣泛支持。", "context": "國際法與去殖民化核心概念。"}, {"term": "collective security", "meaning": "集體安全", "category": "外交與思想", "breakdown": "collective＋security", "family": "collective-security system", "example": "The organization was founded on the idea of collective security.", "example_zh": "該組織建立在集體安全的理念上。", "context": "國際組織核心概念。"}, {"term": "ideological", "meaning": "意識形態的", "category": "外交與思想", "breakdown": "ideology → ideological", "family": "ideology / ideological", "example": "The conflict had both strategic and ideological dimensions.", "example_zh": "這場衝突兼具戰略與意識形態層面。", "context": "政治分析高頻。"}, {"term": "orthodoxy", "meaning": "正統觀點、正統教義", "category": "學術與修辭", "breakdown": "ortho-（正確）＋ doxa（觀點）", "family": "orthodox（正統的）", "example": "The book challenges the postwar orthodoxy.", "example_zh": "本書挑戰戰後的主流正統觀點。", "context": "學術論述常見。"}, {"term": "revisionism", "meaning": "修正主義；修正既有歷史解釋", "category": "學術與修辭", "breakdown": "revision＋-ism", "family": "revisionist historian", "example": "Critics accused the author of historical revisionism.", "example_zh": "批評者指責作者採取歷史修正主義。", "context": "歷史學中需依語境判斷，未必是貶義。"}, {"term": "contentious", "meaning": "有爭議的、容易引發爭論的", "category": "學術與修辭", "breakdown": "contend（爭論）同源", "family": "contention（爭論）", "example": "The legal basis of the tribunal remains contentious.", "example_zh": "該法庭的法律基礎至今仍具爭議。", "context": "學術與評論文高頻。"}, {"term": "tenuous", "meaning": "薄弱的、牽強的", "category": "學術與修辭", "breakdown": "tenuis（細、薄）", "family": "a tenuous link/claim", "example": "The connection between the two events was tenuous.", "example_zh": "這兩件事之間的關聯相當薄弱。", "context": "評論論證常見。"}, {"term": "plausible", "meaning": "看似合理的、可信的", "category": "學術與修辭", "breakdown": "plaus-（值得稱許／接受）", "family": "plausibility", "example": "The explanation is plausible but difficult to prove.", "example_zh": "這個解釋看似合理，但難以證明。", "context": "學術寫作高頻。"}, {"term": "ostensibly", "meaning": "表面上、據稱", "category": "學術與修辭", "breakdown": "ostensible（表面上的）＋ -ly", "family": "ostensible reason", "example": "The measure was ostensibly introduced for security reasons.", "example_zh": "該措施表面上是基於安全理由而推出。", "context": "暗示表面理由與真正動機可能不同。"}, {"term": "purportedly", "meaning": "據稱、號稱", "category": "學術與修辭", "breakdown": "purport（聲稱、意旨）＋ -edly", "family": "purported（所謂的）", "example": "The document was purportedly written in 1941.", "example_zh": "據稱該文件寫於1941年。", "context": "保留態度、避免直接背書資訊真實性。"}, {"term": "rhetoric", "meaning": "修辭；政治話語", "category": "學術與修辭", "breakdown": "rhetor（演說者）同源", "family": "rhetorical", "example": "The rhetoric of liberation masked more coercive policies.", "example_zh": "解放的修辭掩蓋了更具強制性的政策。", "context": "歷史與政治分析高頻。"}, {"term": "polemic", "meaning": "論戰性文章、激烈批判", "category": "學術與修辭", "breakdown": "希臘文 polemos＝戰爭", "family": "polemical（論戰性的）", "example": "The essay is more polemic than balanced analysis.", "example_zh": "這篇文章更像論戰文字，而非平衡分析。", "context": "書評與學術評論常見。"}, {"term": "qualify", "meaning": "限制、修正（某主張）", "category": "學術與修辭", "breakdown": "此處不是「取得資格」，而是為敘述加上限制條件", "family": "qualified claim", "example": "The author later qualified his earlier claim.", "example_zh": "作者後來對先前的主張加以保留與修正。", "context": "學術閱讀非常重要的第二義。"}, {"term": "corroborate", "meaning": "證實、佐證", "category": "學術與修辭", "breakdown": "con-/cor-（一起）＋ robust（強）概念 → 加強證據", "family": "corroborating evidence", "example": "Independent records corroborated the witness's account.", "example_zh": "獨立紀錄佐證了證人的說法。", "context": "歷史研究與法律證據高頻。"}, {"term": "substantiate", "meaning": "證實、提出實質證據支持", "category": "學術與修辭", "breakdown": "substance（實質）→ 給予實質支持", "family": "substantiation", "example": "The allegation could not be substantiated.", "example_zh": "該項指控無法被證實。", "context": "法律、新聞、學術都常見。"}, {"term": "infer", "meaning": "推論", "category": "學術與修辭", "breakdown": "in-＋ ferre（帶來）→ 從證據帶出結論", "family": "inference（推論）", "example": "Historians inferred intent from a series of decisions.", "example_zh": "歷史學者從一連串決策中推論其意圖。", "context": "閱讀論證核心字。"}, {"term": "concede", "meaning": "承認（不利事實）；讓步", "category": "學術與修辭", "breakdown": "con-＋ cedere（讓、退）", "family": "concession", "example": "Even critics concede that the evidence is substantial.", "example_zh": "即使批評者也承認證據相當充分。", "context": "論證寫作超高頻。"}, {"term": "contend", "meaning": "主張；爭辯", "category": "學術與修辭", "breakdown": "con-＋ tendere（伸展、努力）", "family": "contention", "example": "The defense contended that the charges were legally flawed.", "example_zh": "辯方主張這些指控在法律上有缺陷。", "context": "正式論述高頻。"}, {"term": "assert", "meaning": "斷言、主張", "category": "學術與修辭", "breakdown": "ad-＋ serere（連結、宣稱）", "family": "assertion", "example": "The memoir asserts that the decision had already been made.", "example_zh": "這本回憶錄斷言該決定早已作成。", "context": "注意：assert 不代表主張已被證明。"}, {"term": "rebut", "meaning": "反駁", "category": "學術與修辭", "breakdown": "re-（回）＋ butt（反擊概念）", "family": "rebuttal", "example": "The prosecution rebutted the defense's argument.", "example_zh": "檢方反駁了辯方的論點。", "context": "辯論與法律高頻。"}, {"term": "refute", "meaning": "駁倒、證明錯誤", "category": "學術與修辭", "breakdown": "re-＋ futare（反駁）", "family": "refutation", "example": "The new evidence refuted the earlier claim.", "example_zh": "新證據駁倒了先前的主張。", "context": "比 rebut 更強，通常意味成功證明對方錯誤。"}, {"term": "ambiguous", "meaning": "模稜兩可的、含糊的", "category": "學術與修辭", "breakdown": "ambi-（兩邊）＋ agere（帶動）→ 可往兩邊解讀", "family": "ambiguity", "example": "The wording of the order was deliberately ambiguous.", "example_zh": "命令的措辭刻意保持模糊。", "context": "法律與外交文本常見。"}, {"term": "implicit", "meaning": "隱含的", "category": "學術與修辭", "breakdown": "im-＋ plicare（摺疊）→ 意義藏在裡面", "family": "implicitly", "example": "The argument rests on an implicit assumption.", "example_zh": "這個論點建立在一項隱含假設上。", "context": "與 explicit（明示的）相對。"}, {"term": "explicit", "meaning": "明確說出的、明示的", "category": "學術與修辭", "breakdown": "ex-（向外）＋ plicare（展開）", "family": "explicitly", "example": "The agreement contained no explicit guarantee.", "example_zh": "該協議並沒有明文保證。", "context": "與 implicit 相對。"}, {"term": "nuance", "meaning": "細微差異、微妙之處", "category": "學術與修辭", "breakdown": "法語來源", "family": "nuanced（細緻而有層次的）", "example": "The debate requires more historical nuance.", "example_zh": "這場辯論需要更細緻的歷史脈絡判斷。", "context": "書評、學術討論高頻。"}, {"term": "paradoxical", "meaning": "看似矛盾卻可能成立的", "category": "學術與修辭", "breakdown": "para-（旁、反常）＋ doxa（觀點）", "family": "paradox", "example": "The outcome was paradoxical: defeat accelerated reform.", "example_zh": "結果看似矛盾：戰敗反而加速了改革。", "context": "分析歷史因果時常見。"}, {"term": "far-reaching", "meaning": "影響深遠的", "category": "學術與修辭", "breakdown": "far＋reaching", "family": "far-reaching consequences", "example": "The judgment had far-reaching consequences for international law.", "example_zh": "該判決對國際法產生深遠影響。", "context": "正式書面常見搭配。"}, {"term": "vilify", "meaning": "詆毀、妖魔化", "category": "學術與修辭", "breakdown": "vile（卑劣的）＋ -ify（使成為）", "family": "vilification", "example": "Political opponents were routinely vilified in the press.", "example_zh": "政治對手經常在媒體上遭到妖魔化。", "context": "政治宣傳與修辭常見。"}, {"term": "disavow", "meaning": "否認與…有關；拒絕承認", "category": "學術與修辭", "breakdown": "dis-（否定）＋ avow（公開承認）", "family": "disavowal", "example": "The government later disavowed responsibility for the operation.", "example_zh": "政府後來否認對該行動負有責任。", "context": "政治、外交高頻。"}, {"term": "inculcate", "meaning": "反覆灌輸、教導", "category": "學術與修辭", "breakdown": "in-＋ calcare（踩、壓）→ 反覆壓進去", "family": "inculcation", "example": "Schools were used to inculcate loyalty to the state.", "example_zh": "學校被用來反覆灌輸對國家的忠誠。", "context": "教育、宣傳、思想控制常見。"}, {"term": "fixate on", "meaning": "過度專注於、執著於", "category": "學術與修辭", "breakdown": "fixate＝固定住注意力", "family": "fixation", "example": "The debate often fixates on a single controversial judgment.", "example_zh": "這場辯論常過度聚焦於某一項具爭議的判決。", "context": "評論文常見。"}, {"term": "racial overtones", "meaning": "帶有種族意味、種族色彩", "category": "學術與修辭", "breakdown": "overtone＝言外之意、隱含色彩", "family": "political / racial overtones", "example": "The rhetoric carried unmistakable racial overtones.", "example_zh": "這套話語帶有明顯的種族意味。", "context": "文化與政治分析常見。"}, {"term": "be couched in terms of", "meaning": "以……的措辭／框架表述", "category": "學術與修辭", "breakdown": "couch 作動詞＝表達、措辭", "family": "couch an argument in moral terms", "example": "The policy was couched in terms of national security.", "example_zh": "該政策以國家安全的框架加以表述。", "context": "高階書面搭配，值得主動記。"}, {"term": "lay out the terms", "meaning": "列明條件、說明條款", "category": "學術與修辭", "breakdown": "lay out＝攤開、清楚列出", "family": "lay out an argument / plan", "example": "The agreement laid out the terms of surrender.", "example_zh": "協議列明了投降條件。", "context": "歷史、法律與商務皆常見。"}, {"term": "hold A up as B", "meaning": "把 A 樹立／舉作 B 的典範", "category": "學術與修辭", "breakdown": "固定片語", "family": "hold up as an example/model", "example": "The reform was held up as a model for postwar reconstruction.", "example_zh": "這項改革被樹立為戰後重建的典範。", "context": "評論與歷史敘述常見。"}, {"term": "no quarter", "meaning": "不留活口；毫不留情", "category": "戰爭與帝國", "breakdown": "quarter 在舊軍事語境可指寬赦、饒命", "family": "give no quarter", "example": "The phrase suggested that no quarter would be given.", "example_zh": "這句話暗示將毫不留情、不予饒命。", "context": "歷史軍事語境，現代也可比喻毫不留情。"}, {"term": "lurks in the background", "meaning": "潛藏在背景中、隱而未顯", "category": "學術與修辭", "breakdown": "lurk＝潛伏", "family": "lurk behind/beneath", "example": "Questions of race lurk in the background of the debate.", "example_zh": "種族問題潛藏在這場辯論的背景之中。", "context": "分析文章常見隱喻用法。"}, {"term": "sanctimonious", "meaning": "道貌岸然的、自以為道德高尚的", "category": "學術與修辭", "breakdown": "sanct-（神聖）＋ -monious", "family": "sanctimony", "example": "The author dismisses the speech as sanctimonious rhetoric.", "example_zh": "作者將該演說斥為道貌岸然的修辭。", "context": "帶強烈負面評價。"}, {"term": "hypocritical", "meaning": "虛偽的、偽善的", "category": "學術與修辭", "breakdown": "hypocrisy → hypocritical", "family": "hypocrisy / hypocrite", "example": "Critics called the policy hypocritical.", "example_zh": "批評者稱該政策十分虛偽。", "context": "評價性很強，注意作者立場。"}, {"term": "sneer at", "meaning": "嘲笑、鄙視地譏諷", "category": "學術與修辭", "breakdown": "sneer＝冷笑、譏諷", "family": "sneer at an idea/person", "example": "He sneered at the suggestion that the trial was impartial.", "example_zh": "他譏諷「審判公正」這種說法。", "context": "帶明顯態度色彩。"}, {"term": "fume const STORE='tokyoTrialVocabRebuilt_v1';
let state=JSON.parse(localStorage.getItem(STORE)||'{"attempts":{},"total":0,"correct":0}');
let selectedCat='全部', round=[], idx=0, roundWrong=[], answered=false, wrongMode=false;

function save(){localStorage.setItem(STORE,JSON.stringify(state)); updateStats();}
function rec(term){return state.attempts[term]||{seen:0,correct:0,wrong:0,streak:0}}
function setRec(term,r){state.attempts[term]=r}
function updateStats(){
  document.getElementById('doneCount').textContent=state.total||0;
  document.getElementById('acc').textContent=state.total?Math.round(state.correct/state.total*100)+'%':'—';
  let wc=Object.values(state.attempts).filter(x=>x.wrong>0).length;
  document.getElementById('wrongCount').textContent=wc;
  document.getElementById('wrongBtn').textContent='錯題練習 '+wc;
  document.getElementById('wrongBtn').disabled=wc===0;
  document.getElementById('wrongBtn').style.opacity=wc===0?.45:1;
}
function buildFilters(){
 const el=document.getElementById('filters'); el.innerHTML='';
 ["全部", "法律與政治", "戰爭與帝國", "外交與思想", "學術與修辭"].forEach(c=>{let b=document.createElement('button'); b.className='chip'+(c===selectedCat?' active':''); b.textContent=c; b.onclick=()=>{selectedCat=c; buildFilters();}; el.appendChild(b)})
}
function weightedPool(base){
 let arr=[];
 base.forEach(w=>{let r=rec(w.term); let weight=4; if(r.wrong>=2)weight=9; else if(r.wrong===1)weight=6; if(r.streak>=2)weight=2; if(r.streak>=4)weight=1; for(let i=0;i<weight;i++)arr.push(w)})
 return arr;
}
function pickUnique(base,n){
 let chosen=[], used=new Set(), pool=weightedPool(base);
 while(chosen.length<Math.min(n,base.length) && pool.length){
   let w=pool[Math.floor(Math.random()*pool.length)];
   if(!used.has(w.term)){used.add(w.term);chosen.push(w)}
 }
 return chosen;
}
function startRound(wrong=false){
 wrongMode=wrong; roundWrong=[]; idx=0;
 let base=WORDS.filter(w=>selectedCat==='全部'||w.category===selectedCat);
 if(wrong) base=base.filter(w=>rec(w.term).wrong>0);
 if(!base.length) return;
 round=pickUnique(base,15);
 document.getElementById('home').classList.add('hidden');
 document.getElementById('finish').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 renderQuestion();
}
function distractors(correct){
 let same=WORDS.filter(w=>w.term!==correct.term && w.category===correct.category);
 let other=WORDS.filter(w=>w.term!==correct.term && w.category!==correct.category);
 let src=[...same.sort(()=>Math.random()-.5).slice(0,2),...other.sort(()=>Math.random()-.5).slice(0,4)];
 let uniq=[]; let seen=new Set([correct.meaning]);
 for(let w of src){if(!seen.has(w.meaning)){seen.add(w.meaning);uniq.push(w)} if(uniq.length===3)break}
 return uniq;
}
function renderQuestion(){
 answered=false;
 let w=round[idx]; document.getElementById('qcat').textContent=w.category;
 document.getElementById('progress').textContent=(idx+1)+' / '+round.length;
 document.getElementById('term').textContent=w.term;
 let opts=[w,...distractors(w)].sort(()=>Math.random()-.5);
 let box=document.getElementById('options'); box.innerHTML='';
 opts.forEach((o,i)=>{let b=document.createElement('button'); b.className='option'; b.dataset.term=o.term; b.innerHTML='<b>'+(i+1)+'.</b> '+o.meaning; b.onclick=()=>answer(o,w,b); box.appendChild(b)});
 document.getElementById('explain').className='explain';
 document.getElementById('nextBtn').classList.add('hidden');
}
function answer(chosen,correct,btn){
 if(answered)return; answered=true; state.total++; let r=rec(correct.term); r.seen++;
 const ok=chosen.term===correct.term;
 if(ok){state.correct++;r.correct++;r.streak++; if(r.wrong>0)r.wrong=Math.max(0,r.wrong-1);}
 else{r.wrong++;r.streak=0;roundWrong.push(correct.term)}
 setRec(correct.term,r); save();
 document.querySelectorAll('.option').forEach(b=>{if(b.dataset.term===correct.term)b.classList.add('correct')});
 if(!ok)btn.classList.add('wrong');
 let others=distractorsForExplanation(correct,chosen);
 let why=!ok?`<div class="section"><div class="label">為什麼容易選錯？</div><div>你選的是 <b>${chosen.term}</b>（${chosen.meaning}），但本題 <b>${correct.term}</b> 的核心是「${correct.meaning}」。先抓語意方向，再看歷史／法律語境。</div></div>`:'';
 let exp=document.getElementById('explain');
 exp.innerHTML=`<h3>${ok?'答對了':'再看一次'}</h3>
 <div class="answerline">${correct.term}：${correct.meaning}</div>
 <div class="section"><div class="label">書中／歷史語境</div><div>${correct.context}</div></div>
 <div class="section"><div class="label">字根・字首・字族</div><div>${correct.breakdown}</div><div class="note">${correct.family}</div></div>
 <div class="section"><div class="label">例句</div><div class="example">${correct.example}</div><div>${correct.example_zh}</div></div>
 ${why}
 <div class="section"><div class="label">其他選項也一起學</div><div class="others">${others.map(o=>`<div class="other"><b>${o.term}</b>：${o.meaning}</div>`).join('')}</div></div>`;
 exp.classList.add('show'); document.getElementById('nextBtn').classList.remove('hidden');
 setTimeout(()=>exp.scrollIntoView({behavior:'smooth',block:'start'}),80);
}
function distractorsForExplanation(correct,chosen){
 let pool=WORDS.filter(w=>w.term!==correct.term);
 let arr=[]; if(chosen && chosen.term!==correct.term)arr.push(chosen);
 for(let w of pool.sort(()=>Math.random()-.5)){if(!arr.some(x=>x.term===w.term))arr.push(w); if(arr.length===3)break}
 return arr;
}
function nextQuestion(){
 if(idx<round.length-1){idx++;renderQuestion(); window.scrollTo({top:0,behavior:'smooth'})} else finishRound();
}
function finishRound(){
 document.getElementById('quiz').classList.add('hidden'); document.getElementById('finish').classList.remove('hidden');
 let correct=round.length-roundWrong.length; document.getElementById('finishScore').textContent='完成，'+correct+' / '+round.length;
 document.getElementById('finishText').textContent=roundWrong.length?`本輪有 ${roundWrong.length} 題需要再看一次。`:'這輪全對，會降低這些字短期內再次出現的頻率。';
 let b=document.getElementById('reviewRoundBtn'); b.disabled=roundWrong.length===0; b.style.opacity=roundWrong.length?1:.45;
}
function reviewThisRound(){
 let set=new Set(roundWrong); let base=WORDS.filter(w=>set.has(w.term)); if(!base.length)return;
 round=[...base].sort(()=>Math.random()-.5); idx=0; roundWrong=[];
 document.getElementById('finish').classList.add('hidden'); document.getElementById('quiz').classList.remove('hidden'); renderQuestion();
}
document.addEventListener('keydown',e=>{
 if(document.getElementById('quiz').classList.contains('hidden'))return;
 if(!answered && ['1','2','3','4'].includes(e.key)){let opts=[...document.querySelectorAll('.option')]; let b=opts[+e.key-1]; if(b)b.click()}
 else if(answered && e.key==='Enter')nextQuestion();
});
buildFilters(); updateStats();
</script>
</body></html>
